<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDF to Text — PDFtools</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
.text-output{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:16px;font-family:'Geist',monospace;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;}
</style>
</head>
<body>
<div class="page">
  <nav>
    <a class="wordmark" href="index.html">PDF<em>tools</em></a>
    <div class="nav-right"><a class="nav-back" href="index.html">← All tools</a></div>
  </nav>
  <div class="hero">
    <h1>PDF to Text.<br><em>Extract content.</em></h1>
    <p>Extract all text from a PDF file. Copy or download as a .txt file.</p>
  </div>
  <div class="drop-zone" id="dz">
    <div class="dz-icon"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M3 15v3a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-3"/></svg></div>
    <h2>Drop a PDF here</h2><p>or click to browse</p>
    <button class="btn-choose" onclick="document.getElementById('fi').click()">Choose file</button>
  </div>
  <input type="file" id="fi" accept=".pdf,application/pdf"/>
  <div class="files-section" id="fs">
    <div class="row-head"><span id="flbl">—</span><button class="btn-clr" onclick="clearAll()">Clear</button></div>
    <div class="file-list" id="fl"></div>
    <div class="actions"><div class="sp"></div><button class="btn-action" id="mb" onclick="doExtract()">Extract Text <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <div class="prog-wrap" id="pw"><div class="prog-row"><span id="pl">Processing…</span><strong id="pp">0%</strong></div><div class="prog-track"><div class="prog-fill" id="pf"></div></div></div>
    <div class="success-wrap" id="sw"><div class="success-row"><div class="chk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="success-body"><h3>Text extracted</h3><p id="sm"></p><div class="sbtn-row"><button class="btn-dl" id="copy-btn" onclick="copyText()">Copy Text</button><a id="dl" class="btn-outline" download="extracted.txt">Download .txt</a><button class="btn-outline" onclick="clearAll()">Start over</button></div></div></div>
    <div class="text-output" id="tout" style="display:none"></div></div>
  </div>
  <footer><p>Powered by <strong>PDF.js</strong> — processed in your browser. Made by <strong>Subhodaya Racharla</strong></p><p>© 2025 PDFtools</p></footer>
</div>
<div class="toast" id="toast"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let file=null,extractedText='';
const dz=document.getElementById('dz'),fi=document.getElementById('fi'),fs=document.getElementById('fs'),fl=document.getElementById('fl'),flbl=document.getElementById('flbl'),mb=document.getElementById('mb'),pw=document.getElementById('pw'),pf=document.getElementById('pf'),pl=document.getElementById('pl'),pp=document.getElementById('pp'),sw=document.getElementById('sw'),toast=document.getElementById('toast');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)addFile(f);});
dz.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')fi.click();});
fi.addEventListener('change',()=>{if(fi.files[0])addFile(fi.files[0]);fi.value='';});
function addFile(f){if(!f.name.toLowerCase().endsWith('.pdf')&&f.type!=='application/pdf'){notify('Please select a PDF',true);return;}file=f;flbl.textContent=f.name;fl.innerHTML=`<div class="file-card"><div class="pdf-thumb">PDF</div><div class="file-info"><div class="fname">${esc(f.name)}</div><div class="fsize">${fmt(f.size)}</div></div><button class="btn-rm" onclick="clearAll()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;dz.classList.add('hidden');fs.classList.add('show');}
function clearAll(){file=null;extractedText='';fl.innerHTML='';fs.classList.remove('show');dz.classList.remove('hidden');sw.classList.remove('show');pw.classList.remove('show');mb.disabled=false;document.getElementById('tout').style.display='none';}
async function doExtract(){if(!file)return;mb.disabled=true;sw.classList.remove('show');pw.classList.add('show');setP(0,'Loading…');
try{const ab=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;const total=pdf.numPages;let allText='';
for(let i=1;i<=total;i++){setP(Math.round((i/total)*90),`Extracting page ${i} of ${total}…`);const page=await pdf.getPage(i);const tc=await page.getTextContent();const pageText=tc.items.map(item=>item.str).join(' ');allText+=`--- Page ${i} ---\n${pageText}\n\n`;}
setP(100,'Done');extractedText=allText;const blob=new Blob([allText],{type:'text/plain'});const url=URL.createObjectURL(blob);document.getElementById('dl').href=url;const words=allText.split(/\s+/).filter(Boolean).length;document.getElementById('sm').textContent=`${total} pages · ~${words.toLocaleString()} words extracted`;const tout=document.getElementById('tout');tout.textContent=allText;tout.style.display='block';
setTimeout(()=>{pw.classList.remove('show');sw.classList.add('show');mb.disabled=false;},450);}catch(e){console.error(e);pw.classList.remove('show');mb.disabled=false;notify('Extraction failed — PDF may be scanned/image-based',true);}}
function copyText(){if(!extractedText)return;navigator.clipboard.writeText(extractedText).then(()=>notify('Text copied!',false)).catch(()=>notify('Copy failed',true));}
function setP(p,l){pf.style.width=p+'%';pl.textContent=l;pp.textContent=p+'%';}
function fmt(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let tt;function notify(msg,err=false){clearTimeout(tt);toast.textContent=msg;toast.className='toast show'+(err?' err':'');tt=setTimeout(()=>toast.classList.remove('show'),3200);}
</script>
</body></html>
